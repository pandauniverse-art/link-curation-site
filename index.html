    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #e2e8f0;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --hover-color: #2563eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            animation: fadeOut 0.5s ease 2s forwards;
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        .splash-logo {
            font-size: 4rem;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .splash-text {
            font-size: 2rem;
            font-weight: bold;
            color: white;
            margin-top: 1rem;
            animation: pulse 1.5s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
            opacity: 0;
            animation: fadeIn 0.5s ease 2.5s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 1.5rem 0;
        }

        .logo {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 0.6rem 1rem;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .category-filter {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .category-btn {
            padding: 0.4rem 0.8rem;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .category-btn:hover {
            border-color: var(--primary-color);
            background: rgba(99, 102, 241, 0.1);
        }

        .category-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }

        /* Color Picker */
        .color-picker-wrapper { position: relative; }

        .color-picker-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 50%, #ec4899 100%);
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .color-picker-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }

        .color-palette {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 0.5rem;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            min-width: 240px;
        }

        .color-palette.active { display: block; }

        .palette-title {
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 0.75rem;
            color: var(--text-color);
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .color-option {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .color-option:hover {
            transform: scale(1.15);
            border-color: white;
        }

        .custom-color-section {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .custom-color-input { display: flex; gap: 0.5rem; align-items: center; }

        .custom-color-input input[type="color"] {
            width: 40px;
            height: 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .custom-color-input button {
            flex: 1;
            padding: 0.4rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.8rem;
        }

        .custom-color-input button:hover { background: var(--hover-color); }

        /* Language Toggle */
        .language-toggle {
            display: flex;
            gap: 0.2rem;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 0.2rem;
        }

        .lang-btn {
            padding: 0.3rem 0.6rem;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8rem;
        }

        .lang-btn:hover { background: rgba(99, 102, 241, 0.1); }
        .lang-btn.active { background: var(--primary-color); color: white; }

        /* Sites Grid */
        .sites-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .site-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem;
            transition: all 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .site-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-color);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .site-icon {
            font-size: 1.6rem;
        }

        .site-badge {
            font-size: 0.6rem;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            font-weight: 600;
            border: 1px solid rgba(99, 102, 241, 0.25);
            white-space: nowrap;
        }

        .site-name {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .site-description {
            color: var(--text-secondary);
            font-size: 0.8rem;
            line-height: 1.35;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .category-section { margin-bottom: 2rem; }

        .category-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 1rem;
            padding-bottom: 0.4rem;
            border-bottom: 2px solid var(--border-color);
            color: white;
            display: inline-block;
        }

        footer {
            text-align: center;
            padding: 2rem 0;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            margin-top: 2rem;
            font-size: 0.85rem;
        }

        footer a {
            color: var(--primary-color);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        footer a:hover { color: var(--secondary-color); }

        @media (max-width: 1024px) {
            .sites-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 768px) {
            .sites-grid { grid-template-columns: repeat(2, 1fr); }
            .controls { flex-direction: column; }
            .search-box { width: 100%; max-width: 100%; }
        }

        @media (max-width: 480px) {
            .sites-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

        const colorPresets = [
            { primary: '#6366f1', secondary: '#8b5cf6' },
            { primary: '#3b82f6', secondary: '#06b6d4' },
            { primary: '#8b5cf6', secondary: '#d946ef' },
            { primary: '#ec4899', secondary: '#f43f5e' },
            { primary: '#f59e0b', secondary: '#eab308' },
            { primary: '#10b981', secondary: '#14b8a6' },
            { primary: '#059669', secondary: '#047857' },
            { primary: '#0284c7', secondary: '#0369a1' },
            { primary: '#64748b', secondary: '#94a3b8' },
            { primary: '#ea580c', secondary: '#c2410c' } 
        ];

        let currentLang = 'ko';

        function init() {
            renderColorPresets();
            renderSites();
            setupEventListeners();
            updateLanguage(currentLang);
        }

        function renderColorPresets() {
            const colorGrid = document.getElementById('colorGrid');
            colorPresets.forEach(preset => {
                const colorDiv = document.createElement('div');
                colorDiv.className = 'color-option';
                colorDiv.style.background = `linear-gradient(135deg, ${preset.primary}, ${preset.secondary})`;
                colorDiv.onclick = () => applyColorTheme(preset.primary, preset.secondary);
                colorGrid.appendChild(colorDiv);
            });
        }

        function applyColorTheme(primary, secondary) {
            document.documentElement.style.setProperty('--primary-color', primary);
            document.documentElement.style.setProperty('--secondary-color', secondary);
            document.documentElement.style.setProperty('--hover-color', primary);
        }

        function renderSites(filter = 'all', searchTerm = '') {
            const container = document.getElementById('sitesContainer');
            container.innerHTML = '';

            const categories = {
                ai: [], career: [], video: [], design: [], creator: []
            };

            sites.forEach(site => {
                const matchesFilter = filter === 'all' || site.category === filter;
                const matchesSearch = searchTerm === '' || 
                    site.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    site.description[currentLang].toLowerCase().includes(searchTerm.toLowerCase());

                if (matchesFilter && matchesSearch) {
                    categories[site.category].push(site);
                }
            });

            Object.keys(categories).forEach(category => {
                if (categories[category].length > 0) {
                    const section = document.createElement('div');
                    section.className = 'category-section';

                    const title = document.createElement('h2');
                    title.className = 'category-title';
                    title.setAttribute('data-lang-key', `category-${category}`);
                    title.textContent = translations[currentLang][`category-${category}`];
                    section.appendChild(title);

                    const grid = document.createElement('div');
                    grid.className = 'sites-grid';

                    categories[category].forEach(site => {
                        const card = document.createElement('a');
                        card.className = 'site-card';
                        card.href = site.url;
                        card.target = '_blank';
                        card.rel = 'noopener noreferrer';

                        const badgeHtml = site.tag ? `<span class="site-badge" data-lang-key="${site.tag}">${translations[currentLang][site.tag]}</span>` : '';

                        card.innerHTML = `
                            <div class="card-header">
                                <span class="site-icon">${site.icon}</span>
                                ${badgeHtml}
                            </div>
                            <h3 class="site-name">${site.name}</h3>
                            <p class="site-description">${site.description[currentLang]}</p>
                        `;

                        grid.appendChild(card);
                    });

                    section.appendChild(grid);
                    container.appendChild(section);
                }
            });
        }

        function updateLanguage(lang) {
            currentLang = lang;
            
            document.querySelectorAll('[data-lang-key]').forEach(element => {
                const key = element.getAttribute('data-lang-key');
                if (translations[lang][key]) {
                    if (element.tagName === 'INPUT') {
                        element.placeholder = translations[lang][key];
                    } else {
                        element.textContent = translations[lang][key];
                    }
                }
            });

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });

            const activeCategory = document.querySelector('.category-btn.active').getAttribute('data-category');
            const searchTerm = document.getElementById('searchInput').value;
            renderSites(activeCategory, searchTerm);
        }

        function setupEventListeners() {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const category = btn.getAttribute('data-category');
                    const searchTerm = document.getElementById('searchInput').value;
                    renderSites(category, searchTerm);
                });
            });

            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const activeCategory = document.querySelector('.category-btn.active').getAttribute('data-category');
                renderSites(activeCategory, e.target.value);
            });

            const colorPickerBtn = document.getElementById('colorPickerBtn');
            const colorPalette = document.getElementById('colorPalette');
            
            colorPickerBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                colorPalette.classList.toggle('active');
            });

            document.addEventListener('click', (e) => {
                if (!colorPalette.contains(e.target) && e.target !== colorPickerBtn) {
                    colorPalette.classList.remove('active');
                }
            });

            document.getElementById('applyCustomColor').addEventListener('click', () => {
                const customColor = document.getElementById('customColorPicker').value;
                applyColorTheme(customColor, customColor);
            });

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const lang = btn.getAttribute('data-lang');
                    updateLanguage(lang);
                });
            });
        }

        window.addEventListener('load', () => {
            init();
        });
    </script>
